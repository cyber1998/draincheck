name: Bug report
description: Something in Draincheck does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, scenario file and agent setup. Remove any private data first.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: false-pass
    attributes:
      label: Is this a false pass?
      description: Did Draincheck report "safe" when funds moved outside policy?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Draincheck version
      placeholder: output of `draincheck version`
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, output of `draincheck doctor`.
