[project]
name = "draincheck"
version = "0.0.1"
description = "Attack your own wallet-holding AI agent on a local chain fork, and fail the build if money can move outside policy."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "The Draincheck Authors" }]
maintainers = [{ name = "Cyber", email = "cybr1998@gmail.com" }]
keywords = ["ai-agents", "security", "testing", "x402", "anvil", "base", "red-team"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",   # mock x402 services and facilitator
    "httpx>=0.27",      # HTTP client used by the runner and the demo agent
    "pyyaml>=6.0",      # loads scenario YAML files (safe_load only)
    "requests>=2.31",   # used by web3; Draincheck builds its proxy-free RPC session
    "typer>=0.12",      # CLI
    "uvicorn>=0.30",    # serves the local mock services
    "web3>=7.0",        # talks to the local anvil chain
]

[project.urls]
Homepage = "https://github.com/cyber1998/draincheck"
Issues = "https://github.com/cyber1998/draincheck/issues"
Changelog = "https://github.com/cyber1998/draincheck/blob/main/CHANGELOG.md"

[project.scripts]
draincheck = "draincheck.cli:app"

[project.optional-dependencies]
# Test LangGraph agents in-process (draincheck.adapters.langgraph).
# langsmith comes with langchain-core; the adapter imports it to keep tracing off.
langgraph = ["langgraph>=1.2,<2", "langchain-core>=1.7,<2", "langsmith>=0.14"]

[dependency-groups]
dev = [
    "draincheck[langgraph]",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draincheck"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, subprocess and the published anvil dev keys.
"tests/**" = ["S101", "S603", "S105", "S106"]
"examples/**" = ["S105"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "anvil: needs the anvil binary on PATH (skipped locally if missing, required in CI)",
    "fork: forks Base through DRAINCHECK_FORK_URL (skipped when it is unset, as in CI)",
]
addopts = "-ra --strict-markers"
